name: Build ZMK firmware

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Gesture regression tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, known-good build
      - name: Test production gesture state machine
        run: python3 tests/run_gesture_tests.py

  build:
    needs: test
    runs-on: ubuntu-latest
    container:
      # Exact image used by successful run 35343870812; no SDK upgrade.
      image: zmkfirmware/zmk-build-arm@sha256:edb1c953438c6f720ddb79c3762f3972013b7fbbaf4fff3592fc869983e7afc5
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Init
        run: |
          git config --global --add safe.directory ${{ github.workspace }}
          rm -rf .west dependencies
          make init-standalone

      - name: Verify and record dependency versions
        run: |
          west manifest --resolve -o resolved-manifest.yml
          python3 scripts/verify_manifest.py resolved-manifest.yml
          west manifest --freeze -o frozen-manifest.yml

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          make build-all 2>&1 | tee build-all.log

      - name: Verify generated firmware settings
        run: python3 scripts/verify_build.py

      - name: Print build errors
        if: failure()
        shell: bash
        run: |
          errors="$(mktemp)"
          tail_log="$(mktemp)"
          pattern='(^|[ :])(error:|FAILED:|undefined reference|ld\.bfd:|collect2:|ninja: build stopped|CMake Error|devicetree error|warning:.*was assigned|FATAL ERROR|Traceback|Exception)'
          if [ -f build-all.log ]; then
            grep -H -n -Ei "$pattern" build-all.log > "$errors" || true
            tail -n 160 build-all.log > "$tail_log" || true
          fi
          find ./build -type f -name stdout_and_stderr.log \
          -exec grep -H -n -Ei "$pattern" {} \; >> "$errors" || true
          head -120 "$errors" | while IFS= read -r line; do
            echo "::error title=Build error excerpt::$line"
          done
          tail -80 "$tail_log" | while IFS= read -r line; do
            echo "::error title=Build log tail::$line"
          done
          {
            echo "## Build error excerpts"
            echo
            echo '```'
            cat "$errors"
            echo '```'
            echo
            echo "## Build log tail"
            echo
            echo '```'
            cat "$tail_log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$errors"
          cat "$tail_log"

      - name: Archive reproducibility and diagnostic data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-diagnostics
          include-hidden-files: true
          path: |
            resolved-manifest.yml
            frozen-manifest.yml
            build-all.log
            build/**/stdout_and_stderr.log
            build/**/zephyr/.config
            build/**/zephyr/zephyr.dts
            build/**/zephyr/zmk.elf
            build/**/zephyr/zephyr.map

      - name: Copy artifacts
        shell: sh -x {0}
        run: |
          mkdir -p artifacts
          find ./build -type f -path '*/zephyr/zmk.uf2' \
          | while read -r f; do
              echo "Found: $f"
              name=$(basename "$(dirname "$(dirname "$f")")")
              cp "$f" "artifacts/${name}.uf2"
            done

      - name: Archive artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware
          path: artifacts
