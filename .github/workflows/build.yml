name: Build ZMK firmware

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init
        run: |
          git config --global --add safe.directory ${{ github.workspace }}
          rm -rf .west dependencies
          make init-standalone

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          make build-all 2>&1 | tee build-all.log

      - name: Print build errors
        if: failure()
        shell: bash
        run: |
          errors="$(mktemp)"
          tail_log="$(mktemp)"
          pattern='(^|[ :])(error:|FAILED:|undefined reference|ld\.bfd:|collect2:|ninja: build stopped|CMake Error|devicetree error|warning:.*was assigned|FATAL ERROR|Traceback|Exception)'
          if [ -f build-all.log ]; then
            grep -H -n -Ei "$pattern" build-all.log > "$errors" || true
            tail -n 160 build-all.log > "$tail_log" || true
          fi
          find ./build -type f -name stdout_and_stderr.log \
          -exec grep -H -n -Ei "$pattern" {} \; >> "$errors" || true
          head -120 "$errors" | while IFS= read -r line; do
            echo "::error title=Build error excerpt::$line"
          done
          tail -80 "$tail_log" | while IFS= read -r line; do
            echo "::error title=Build log tail::$line"
          done
          {
            echo "## Build error excerpts"
            echo
            echo '```'
            cat "$errors"
            echo '```'
            echo
            echo "## Build log tail"
            echo
            echo '```'
            cat "$tail_log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$errors"
          cat "$tail_log"

      - name: Archive build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-all.log
            build/**/stdout_and_stderr.log

      - name: Copy artifacts
        shell: sh -x {0}
        run: |
          mkdir -p artifacts
          find ./build -type f -path '*/zephyr/zmk.uf2' \
          | while read -r f; do
              echo "Found: $f"
              name=$(basename "$(dirname "$(dirname "$f")")")
              cp "$f" "artifacts/${name}.uf2"
            done

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: artifacts
