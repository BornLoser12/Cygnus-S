name: Build ZMK firmware

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        continue-on-error: true
        env:
          cache_name: cache-west-modules
        with:
          path: dependencies/
          key: ${{ runner.os }}-build-${{ env.cache_name }}-${{ hashFiles('config/west*.yml', 'build.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache_name }}-

      - name: Init
        run: |
          git config --global --add safe.directory ${{ github.workspace }}
          make init-standalone

      - name: Build
        run: make build-all

      - name: Print build errors
        if: failure()
        run: |
          {
            echo "## Build error excerpts"
            echo
            echo '```'
            find ./build -type f -name stdout_and_stderr.log \
            -exec sh -c 'for f do echo "### $f"; grep -H -n -Ei "error|failed|fatal|undefined reference|devicetree|CMake Error|Kconfig" "$f" | head -200 || true; done' sh {} \;
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          find ./build -type f -name stdout_and_stderr.log \
          -exec grep -H -n -Ei 'error|failed|fatal|undefined reference|devicetree|CMake Error|Kconfig' {} \; || true

      - name: Archive build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/**/stdout_and_stderr.log

      - name: Copy artifacts
        shell: sh -x {0}
        run: |
          mkdir -p artifacts
          find ./build -type f -path '*/zephyr/zmk.uf2' \
          | while read -r f; do
              echo "Found: $f"
              name=$(basename "$(dirname "$(dirname "$f")")")
              cp "$f" "artifacts/${name}.uf2"
            done

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: artifacts
