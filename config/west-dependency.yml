manifest:
  version: 1.2
  defaults:
    remote: cormoran
    revision: main

  remotes:
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: caksoylar
      url-base: https://github.com/caksoylar

  projects:
    # DYA build helper: enables `west zmk-build`, which understands `build.yaml`
    # artifacts and plural `snippets`.
    - name: zmk-west-commands
      import: true

    # Current DYA Studio stack: ZMK main + DYA extensions, Zephyr 4.1, and
    # the half-duplex UART fixes used by recent DYA Dash firmware.
    - name: zmk
      revision: main+dya
      import:
        file: app/west.yml
      clone-depth: 1
    - name: zephyr
      revision: v4.1.0+zmk-fixes+nrf-half-duplex-uart
      clone-depth: 1
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_silabs
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m

    # Device/driver modules.
    - name: zmk-driver-pmw3610-with-custom-studio-rpc
    - name: zmk-rgbled-widget
      remote: caksoylar

    # DYA Studio runtime/custom RPC modules.
    - name: zmk-feature-custom-settings
    - name: zmk-module-runtime-input-processor
    - name: zmk-module-ble-management
    - name: zmk-module-battery-history
    - name: zmk-behavior-runtime-sensor-rotate
      revision: feat/custom-settings-storage
    - name: zmk-feature-runtime-combo
    - name: zmk-feature-runtime-macro
    - name: zmk-feature-input-stream
    - name: zmk-module-settings-rpc
    - name: zmk-feature-os-detection
    - name: zmk-feature-default-layer
      revision: codex/custom-rpc-rewrite
      import: true

    # Extra DYA Studio helpers used by the current DYA Dash firmware.
    - name: zmk-feature-module-physical-layout
    - name: zmk-feature-fast-keymap
    - name: zmk-feature-device-info
    - name: zmk-feature-watchdog
    - name: zmk-feature-zephyr-setting-expose
    - name: zmk-module-devtool
    - name: zmk-feature-studio-rpc-perf
    - name: zmk-feature-kscan-diagnostics

  self:
    path: config
